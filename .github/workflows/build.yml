name: Build APK

# Chạy khi chủ repo bấm tay (tab Actions → Build APK → Run workflow) hoặc đẩy tag phiên bản, ví dụ: git push origin v2.2.
# Cần 4 secret: ZALODUO_KEYSTORE_BASE64, ZALODUO_KEYSTORE_PASSWORD, ZALODUO_KEY_ALIAS, ZALODUO_KEY_PASSWORD.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    # Chỉ chủ repo chạy được (bản fork / người khác không build, không dùng được khóa ký trong Secrets).
    if: github.actor == github.repository_owner && github.repository == 'quocanh21081992/ZaloDuo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Khóa ký lấy từ Secrets của repo (Settings → Secrets and variables → Actions), không nằm trong mã nguồn.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZALODUO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Thiếu secret ZALODUO_KEYSTORE_BASE64" >&2; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zaloduo.jks"
          echo "ZALODUO_KEYSTORE_FILE=$RUNNER_TEMP/zaloduo.jks" >> "$GITHUB_ENV"

      # Tên bản build: ZaloDuo-<versionName>-<commit>, ví dụ ZaloDuo-1.1-b95dc31.apk
      - name: Build APK
        env:
          ZALODUO_KEYSTORE_PASSWORD: ${{ secrets.ZALODUO_KEYSTORE_PASSWORD }}
          ZALODUO_KEY_ALIAS: ${{ secrets.ZALODUO_KEY_ALIAS }}
          ZALODUO_KEY_PASSWORD: ${{ secrets.ZALODUO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$ZALODUO_KEYSTORE_FILE"
          VERSION=$(sed -n "s/.*versionName = '\(.*\)'.*/\1/p" app/build.gradle)
          SHA=$(git rev-parse --short=7 HEAD)
          NAME="ZaloDuo-$VERSION-$SHA"
          cp app/build/outputs/apk/release/app-release.apk "$NAME.apk"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZaloDuo-apk
          path: ${{ env.NAME }}.apk

      # Tạo một Release chứa file .apk để tải thẳng từ điện thoại (không phải giải nén).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ env.SHA }}
          name: ZaloDuo ${{ env.VERSION }} (${{ env.SHA }})
          files: ${{ env.NAME }}.apk

  # Chạy thử app trên máy ảo Android: mở app, chụp màn hình, lấy log lỗi.
  # Kết quả được đẩy lên nhánh ci/api-<level> (không ảnh hưởng nhánh main).
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ZaloDuo-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash ci/smoke.sh

      - name: Publish results to branch
        if: always()
        run: |
          mkdir -p ci-out
          cd ci-out
          git init -q -b results
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "smoke api-${{ matrix.api-level }} run ${{ github.run_number }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" results:ci/api-${{ matrix.api-level }}
